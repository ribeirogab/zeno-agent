name: Release

run-name: >
  Release ${{ inputs.version != '' && inputs.version || 'auto-derived' }} (${{ inputs.prerelease && 'pre-release' || 'stable' }}) by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Tag (e.g. v2026.5.4). Leave empty to auto-derive from today's UTC date."
        required: false
        type: string
        default: ""
      prerelease:
        description: "Mark as pre-release"
        required: false
        type: boolean
        default: true
      title:
        description: "Release title (defaults to the resolved tag)"
        required: false
        type: string
        default: ""

jobs:
  release:
    name: Tag and create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag and title
        id: resolve
        run: |
          if [ -z "${{ inputs.version }}" ]; then
            BASE="v$(date -u +%Y).$(date -u +%-m).$(date -u +%-d)"
            TAG="$BASE"
            N=1
            while git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1; do
              TAG="$BASE.$N"
              N=$((N+1))
              if [ $N -gt 99 ]; then
                echo "::error::100 tags on $BASE already exist; pass an explicit version input." >&2
                exit 1
              fi
            done
          else
            TAG="${{ inputs.version }}"
            if git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1; then
              echo "::error::tag $TAG already exists; pick another version." >&2
              exit 1
            fi
          fi
          if [ -z "${{ inputs.title }}" ]; then
            TITLE="$TAG"
          else
            TITLE="${{ inputs.title }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "title=$TITLE" >> $GITHUB_OUTPUT

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Bump root package.json version
        run: |
          TAG="${{ steps.resolve.outputs.tag }}"
          VER="${TAG#v}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pnpm version "$VER" --no-git-tag-version
          git add package.json
          git commit -m "chore(release): $TAG"
          git push origin HEAD:main

      - name: Push tag
        run: |
          git tag "${{ steps.resolve.outputs.tag }}"
          git push origin "${{ steps.resolve.outputs.tag }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FLAG=""
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            FLAG="--prerelease"
          fi
          gh release create "${{ steps.resolve.outputs.tag }}" \
            $FLAG \
            --generate-notes \
            --title "${{ steps.resolve.outputs.title }}"
