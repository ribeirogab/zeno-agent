name: zeno-default

services:
  agent:
    build:
      context: .
      dockerfile: infra/Dockerfile
    image: zeno-agent:dev
    env_file: profiles/default/.env
    init: true
    ports:
      - "3000:3000"
    volumes:
      - workspace-default:/workspace
      - claude_home:/home/node/.claude
      - ./agent:/app/agent:ro
      - ./profiles/default:/app/profile:ro
    restart: unless-stopped
    stdin_open: true
    tty: true

volumes:
  workspace-default:
  claude_home:
    external: true
