name: zeno-default

services:
  agent:
    build:
      context: .
      dockerfile: infra/Dockerfile
    image: zeno-agent:dev
    env_file: profiles/default/.env
    environment:
      ZENO_PROFILE: default
    init: true
    ports:
      - "3000:3000"
    volumes:
      - workspace-default:/workspace
      # Spec 0071: per-profile claude_home prevents cross-profile leakage of
      # session JSONLs and the SDK credentials cache. Was a single shared
      # `claude_home` external volume; migrate via infra/migrate-claude-home.sh.
      - claude_home_default:/home/node/.claude
      - ./agent:/app/agent:ro
      - ./profiles/default:/app/profile:ro
    restart: unless-stopped
    stdin_open: true
    tty: true

volumes:
  workspace-default:
  claude_home_default:
