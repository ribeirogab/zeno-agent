name: zeno-fn

services:
  agent:
    build:
      context: .
      dockerfile: infra/Dockerfile
    image: zeno-agent:dev
    env_file: profiles/fn/.env
    environment:
      ZENO_PROFILE: fn
    init: true
    ports:
      - "3001:3000"
    volumes:
      - workspace-fn:/workspace
      # Spec 0071: per-profile claude_home prevents cross-profile leakage of
      # session JSONLs and the SDK credentials cache. Migrate the shared
      # `claude_home` volume via infra/migrate-claude-home.sh fn.
      - claude_home_fn:/home/node/.claude
      - ./agent:/app/agent:ro
      - ./profiles/fn:/app/profile:ro
    restart: unless-stopped
    stdin_open: true
    tty: true

volumes:
  workspace-fn:
  claude_home_fn:
