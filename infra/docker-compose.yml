name: zeno-agent

services:
  zeno-agent:
    build:
      context: .
      dockerfile: infra/Dockerfile
    image: zeno-agent:dev
    container_name: zeno-agent
    env_file: .env
    init: true
    ports:
      - "3000:3000"
    volumes:
      - workspace:/workspace
      - claude_home:/home/node/.claude
      - ./profile:/app/profile:ro
    restart: unless-stopped
    stdin_open: true
    tty: true

volumes:
  workspace:
  claude_home:
