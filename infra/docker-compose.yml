name: zeno-agent

services:
  zeno-agent:
    build:
      context: .
      dockerfile: infra/Dockerfile
    image: zeno-agent:dev
    container_name: zeno-agent
    env_file: .env
    volumes:
      - workspace:/workspace
      - ./profile:/app/profile:ro
    restart: unless-stopped
    stdin_open: true
    tty: true

volumes:
  workspace:
