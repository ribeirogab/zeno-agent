# Zeno user config — crons + future sections.
#
# Cron entry schema:
#   name: kebab-case identifier (required)
#   description: human-readable (optional)
#   schedule: 5-field cron expression (required)
#   prompt: what Zeno should do when the cron fires (required)
#   notify:
#     conversation_id: channel/DM id where output is posted; if missing, the run is logged but not posted
#     thread_id: optional thread id to reply inside (Slack channel threads)
#
# Example:
# crons:
#   - name: morning-pr-summary
#     description: Daily summary of open PRs at 9am on weekdays
#     schedule: "0 9 * * 1-5"
#     prompt: |
#       List open PRs across the user's GitHub orgs.
#       For each one: title, author, age, CI status. Output as bullets.
#     notify:
#       conversation_id: C12345

crons: []
