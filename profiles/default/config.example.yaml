# Zeno user config — crons + future sections.
#
# Cron entry schema:
#   name: kebab-case identifier (required)
#   description: human-readable (optional)
#   schedule: 5-field cron expression (required)
#   prompt: what Zeno should do when the cron fires (required)
#   notify:
#     conversation_id: channel/DM id where output is posted; if missing, the run is logged but not posted
#     thread_id: optional thread id to reply inside (Slack channel threads)
#
# Example:
# crons:
#   - name: morning-pr-summary
#     description: Daily summary of open PRs at 9am on weekdays
#     schedule: "0 9 * * 1-5"
#     prompt: |
#       List open PRs across the user's GitHub orgs.
#       For each one: title, author, age, CI status. Output as bullets.
#     notify:
#       conversation_id: C12345

crons: []

# GitHub App auth (optional). Generates installation tokens at boot and sets
# the specified env vars so skills can use them for org-scoped git/gh operations.
# Commits and PRs appear as "<app-name>[bot]" instead of your personal user.
#
# github_app:
#   app_id: "123456"
#   private_key_file: path/to/app.pem  # relative to profile/
#   git_identity:
#     name: "my-app[bot]"
#     email: "123456+my-app[bot]@users.noreply.github.com"
#   installations:
#     - name: MyOrg
#       id: "12345678"
#       env_var: MY_ORG_GH_TOKEN

# Guardrails — pre-flight approval flow for sensitive tool calls.
# When this section is absent, Zeno runs unguarded (logs a warning at boot).
# When present, every tool call goes through a policy pipeline:
#   1. always_sensitive (literal/wildcard tool names) → owner approval
#   2. read_only skills → auto-allow (declare `read_only: true` in SKILL.md frontmatter)
#   3. Haiku classifier → owner approval if the model deems the call sensitive
#   4. terminal audit log (table approvals_log)
# Approval is reaction-based: 👍 allow, 👎 deny, no reaction within timeout = deny.
# When the requester is the owner: prompt posts in the same thread.
# When the requester is anyone else: prompt posts in the owner's DM.
#
# approvals:
#   owner_slack_user_id: U0ABC123
#   always_sensitive:
#     - mcp__github__merge_pull_request
#     - mcp__github__delete_*
#   approval_timeout_sec: 600
#   classifier_model: claude-haiku-4-5
#   dm_owner_only: true              # default true; set false to allow anyone to DM the bot
